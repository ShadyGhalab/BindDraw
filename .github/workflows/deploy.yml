name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        env:
          PUBLIC_APPSFLYER_ONELINK_URL: ${{ vars.PUBLIC_APPSFLYER_ONELINK_URL }}
        run: npm run build

      - name: Verify public app links and invitation pages
        run: |
          mkdir -p dist/.well-known
          cp public/.well-known/assetlinks.json public/.well-known/apple-app-site-association dist/.well-known/
          cmp public/.well-known/assetlinks.json dist/.well-known/assetlinks.json
          cmp public/.well-known/apple-app-site-association dist/.well-known/apple-app-site-association
          test -f dist/match/index.html
          test -f dist/match/invite.js
          node --test tests/app-links.test.mjs tests/beta-portal.test.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
